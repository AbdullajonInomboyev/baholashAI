services:
  - type: web
    name: oquv-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
      # DATABASE_URL ni Render panelidan qo'lda kiritasiz (mavjud bazadan)
      - key: DATABASE_URL
        sync: false
