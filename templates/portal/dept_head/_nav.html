{% if departments|length > 1 %}
<div style="padding:0 12px 8px">
  <select class="side-sel" onchange="location.href=this.value">
    {% for d in departments %}<option value="{% url 'portal:dept_switch' d.pk %}" {% if d.pk == active_dept.pk %}selected{% endif %}>{{ d.name }}</option>{% endfor %}
  </select>
</div>
{% endif %}
<div class="group">Kafedra</div>
<a href="{% url 'portal:dept_dashboard' %}" class="{% if active == 'dashboard' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Boshqaruv paneli</span></a>
<a href="{% url 'portal:dept_courses' %}" class="{% if active == 'courses' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a2 2 0 0 1 2 2v14a1 1 0 0 0-1-1H4z"/><path d="M20 6v14a1 1 0 0 0-1-1H8"/></svg><span>Fanlar va o‘qituvchilar</span></a>
<a href="{% url 'portal:dept_teachers' %}" class="{% if active == 'teachers' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg><span>O‘qituvchilar</span></a>
<a href="{% url 'portal:dept_curricula' %}" class="{% if active == 'curricula' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a2 2 0 0 1 2 2v14a1 1 0 0 0-1-1H4z"/><path d="M9 8h6M9 12h4"/></svg><span>O‘quv rejalari</span></a>
<a href="{% url 'portal:dept_resources' %}" class="{% if active == 'resources' %}active{% endif %}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>Resurs sifati (AI)</span></a>
<a href="{% url 'portal:dept_remarks' %}" class="{% if active == 'remarks' %}active{% endif %}">
