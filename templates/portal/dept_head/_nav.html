{% if departments|length > 1 %}
<div style="padding:0 12px 8px">
  <select class="side-sel" onchange="location.href=this.value">
    {% for d in departments %}<option value="{% url 'portal:dept_switch' d.pk %}" {% if d.pk == active_dept.pk %}selected{% endif %}>{{ d.name }}</option>{% endfor %}
  </select>
</div>
{% endif %}
